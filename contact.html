    <main class="contact-page-content">
        <div class="contact-form-container">
            <h1>Contact Our Travel Desk</h1>
            <p style="text-align: center; margin-bottom: 20px;">We're here to assist you with your booking or any travel inquiries. Expect a reply within 24 hours.</p>
            <form>
                <input type="text" placeholder="Your Full Name" required>
                <input type="email" placeholder="Your Email Address" required>
                <input type="text" placeholder="Subject">
                <textarea placeholder="Your Message" rows="5" required></textarea>
                <button type="submit" class="btn">Send Inquiry</button>
            </form>
        </div>
    </main>

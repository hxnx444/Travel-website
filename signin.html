<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wander & Co. - Sign In</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="animations.css">
    <script src="javascript.js"></script> 
    
</head>

<body>

    <header>
        <a href="home.html" class="logo-container">Wander & Co</a>
        
        <nav>
            <a href="home.html">Home</a>
            <a href="hotels.html">Hotels</a>
            <a href="flight.html">Flights</a>
            <a href="car rentals.html">Car Rentals</a>
            <a href="offers.html">Offers</a>
            <a href="contact.html">Contact Us</a>
            <a href="profile.html">Profile</a>
            
            <a href="signin.html" class="btn-signin active">Sign in</a> 
        </nav>
    </header>

    <main class="contact-page-content">
        <div class="auth-container">
            <h1>Welcome Back</h1>
            <p style="text-align: center; margin-bottom: 30px;">Please enter your credentials to access your traveler profile.</p>
            
            <form>
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
                
                <a href="#" style="display: block; text-align: right; margin-bottom: 20px; color: var(--accent-gold);">Forgot Password?</a>
                
                <button type="submit" class="btn">Sign In</button>
            </form>
            
            <p style="text-align: center; margin-top: 25px; font-size: 15px;">
                Don't have an account? 
                <a href="register.html" style="font-weight: bold; color: var(--btn-brown);">Register Here</a>
            </p>
        </div>
    </main>
    
    <footer>
        <p>Wander & Co. | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
